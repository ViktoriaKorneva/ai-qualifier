# Конфиг клиента. Всё, что меняется от заказчика к заказчику, живёт здесь,
# а не в коде: вопросы, тексты, правила отсева, база знаний, скоринг.
#
# ВНИМАНИЕ: «Смена» — гипотетический клиент, придуманный для учебного прогона.
# Реального заказчика с такими данными нет.

client:
  name: "Смена"
  business: "сервис подработок: промоутеры, курьеры, работники склада"
  channel_hint: "отклики с Авито"
  manager_contact: "@smena_hr"

# Первое сообщение. Отправляется в ответ на первый запрос кандидата.
greeting: |
  Здравствуйте! Это «Смена» — подработки со свободным графиком.
  Помогу оформить отклик за пару минут: задам 4 коротких вопроса,
  а потом расскажу, как начать. Если что-то интересно — спрашивайте по ходу.

# Вопросы анкеты. Порядок важен: он же порядок состояний диалога.
# type определяет, как разбирать ответ, required — можно ли пропустить.
questions:
  - key: name
    type: text
    required: true
    ask: "Как вас зовут?"
    reask: "Не разобрала имя. Напишите, пожалуйста, как к вам обращаться."

  - key: age
    type: age
    required: true
    ask: "Сколько вам полных лет?"
    reask: "Нужен возраст числом — например, 23."

  - key: phone
    type: phone
    required: true
    ask: "На какой номер телефона отправить детали? Формат любой, например +7 900 123-45-67."
    reask: "Похоже, в номере опечатка. Российский номер — 11 цифр, начинается с 7 или 8."

  - key: district
    type: choice
    required: true
    ask: "В каком районе вам удобно работать? Центральный, Северный, Южный, Заречный или любой."
    reask: "Не нашла такой район. Есть Центральный, Северный, Южный, Заречный — или напишите «любой»."
    options: ["центральный", "северный", "южный", "заречный", "любой"]

# Жёсткие правила. Проверяются сразу после получения поля.
# Нарушение = вежливый отказ и конец диалога.
rules:
  - field: age
    condition: "less_than"
    value: 17
    action: reject
    message: |
      Спасибо, что откликнулись! К сожалению, мы оформляем подработки
      только с 17 лет — это требование по трудовому договору.
      Будем рады видеть вас, когда исполнится 17.

  - field: age
    condition: "greater_than"
    value: 70
    action: flag
    message: "возраст выше типового — уточнить у менеджера доступные позиции"

# Что отправляем после успешной анкеты.
registration:
  instruction: |
    Отлично, {name}! Осталось одно действие:
    1. Скачайте приложение «Смена» в RuStore или App Store.
    2. Зарегистрируйтесь по номеру {phone}.
    3. В анкете выберите район «{district}» и отметьте удобные дни.
    После регистрации напишите «готово» — я передам вас координатору,
    и он подберёт ближайшие смены.
  confirm_words: ["готово", "зарегистрировался", "зарегистрировалась", "сделал", "сделала", "да", "ок", "окей", "прошел", "прошла"]
  reminder_after_hours: 3
  reminder_text: |
    {name}, напоминаю про регистрацию в приложении «Смена» — без неё
    не смогу передать вас координатору. Получилось зарегистрироваться?
    Если что-то не выходит, напишите, в чём затык, — разберёмся.

# Финал успешного диалога.
handoff:
  message: |
    Готово, {name}! Передаю вас координатору — он свяжется по номеру {phone}
    в рабочее время (пн–сб, 9:00–20:00) и предложит ближайшие смены в районе «{district}».
  manager_note: "кандидат подтвердил регистрацию, готов к выходу"

# База знаний: ответы на типовые вопросы.
# Сначала ищем здесь по ключевым словам, и только если не нашли —
# идём в LLM. Это дешевле, быстрее и предсказуемее.
knowledge:
  - id: schedule
    keywords: ["график", "когда работать", "часы", "смена длится", "во сколько", "выходные", "подстроить"]
    answer: |
      График свободный: смены по 4, 6 или 8 часов, вы сами выбираете дни
      в приложении. Минимум — 2 смены в неделю, максимум не ограничен.

  - id: payment
    keywords: ["оплата", "сколько платят", "ставка", "зарплата", "деньги", "заработок", "получу"]
    answer: |
      Ставка зависит от позиции: промоутер — 250 ₽/час, курьер — 300 ₽/час,
      склад — 280 ₽/час. Выплаты раз в неделю, по пятницам, на карту.

  - id: documents
    keywords: ["документы", "паспорт", "снилс", "договор", "оформление", "самозанят"]
    answer: |
      Нужен паспорт и СНИЛС. Оформляем по договору ГПХ или как с самозанятым —
      как вам удобнее. Всё подписывается электронно в приложении.

  - id: experience
    keywords: ["опыт", "без опыта", "научат", "обучение", "первый раз", "справлюсь"]
    answer: |
      Опыт не нужен. Перед первой сменой — короткий инструктаж в приложении
      на 15 минут, на месте помогает старший смены.

  - id: location
    keywords: ["где", "адрес", "далеко", "добираться", "район работы", "точка"]
    answer: |
      Точки есть во всех районах города. В приложении видно адрес и время
      каждой смены до того, как вы её возьмёте, — берёте только удобные.

  - id: payout_speed
    keywords: ["когда деньги", "аванс", "сразу", "в день смены", "быстро выплат"]
    answer: |
      Выплата за отработанные смены приходит в ближайшую пятницу.
      Авансов и выплат в день смены пока нет.

# Скоринг. Считаем по завершении анкеты, определяет приоритет для менеджера.
scoring:
  hot:
    description: "анкета заполнена, регистрация подтверждена"
    min_score: 5
  warm:
    description: "анкета заполнена, регистрация не подтверждена"
    min_score: 3
  cold:
    description: "анкета не закончена или ответы уклончивые"
    min_score: 0

# Тексты на случаи, когда сценарий сломался.
fallback:
  unknown_question: |
    Хороший вопрос — не хочу выдумывать ответ. Передам его координатору,
    он ответит точно. Продолжим анкету?
  escalate: |
    Такое лучше обсудить с человеком. Передаю диалог координатору {manager_contact},
    он свяжется с вами в рабочее время.
  escalate_triggers: ["жалоба", "суд", "обман", "не заплатили", "кинули", "полиция", "юрист"]
