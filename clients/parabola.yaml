# Конфиг клиента. Всё, что меняется от заказчика к заказчику, живёт здесь,
# а не в коде: вопросы, тексты, правила, база знаний, скоринг, подбор программы.
#
# ВНИМАНИЕ: «Парабола» — вымышленный центр, придуманный для демонстрации.
# Название, программы, цены, расписание и преимущества выдуманы. Реальные
# центры, отзывы, результаты учеников и статистика баллов не используются.
# Это демонстрация возможностей решения, а не клиентский кейс.

client:
  name: "Парабола"
  business: "центр подготовки к ЕГЭ и ОГЭ, очно и онлайн"
  channel_hint: "заявки с сайта и из соцсетей"
  manager_contact: "@parabola_admin"

# Демо-режим: что скрывать в карточке администратора на публичном стенде.
# У реального клиента маскировка выключается — ему нужен рабочий телефон.
demo:
  mask_fields: ["contact"]
  notice: "Демонстрация. Не вводите реальные персональные данные — ничего не сохраняется."

greeting: |
  Здравствуйте! Это «Парабола» — подготовка к ЕГЭ и ОГЭ.
  Помогу подобрать программу и записать на бесплатную диагностику.
  Пары вопросов хватит, а дальше расскажу, что подходит.
  Если что-то интересно — спрашивайте по ходу.

# Вопросы. required: false — поле желательное: его спрашивают, но диалог
# из-за него не буксует. phase: closing — поле спрашивают на закрытии,
# когда человек уже увидел предложение.
questions:
  - key: grade
    type: scale
    required: true
    ask: "В каком классе учится ребёнок?"
    reask: "Подскажите класс — 8, 9, 10 или 11."
    options:
      "6": ["6 класс", "6 классе", "шест", "6-й", "6"]
      "7": ["7 класс", "7 классе", "седьм", "7-й", "7"]
      "8": ["8 класс", "8 классе", "восьм", "8-й", "8"]
      "9": ["9 класс", "9 классе", "девят", "9-й", "9"]
      "10": ["10 класс", "10 классе", "десят", "10-й", "10"]
      "11": ["11 класс", "11 классе", "одиннадцат", "11-й", "выпускн", "11"]

  - key: subjects
    type: multi
    required: true
    ask: "Какие предметы нужно подтянуть? Можно несколько."
    reask: "Напишите предметы — например, «математика и физика»."
    options:
      "математика": ["математик", "матеш", "алгебр", "геометр"]
      "русский язык": ["русск"]
      "физика": ["физик"]
      "информатика": ["информатик", "программирован"]
      "химия": ["хими"]
      "биология": ["биолог"]
      "обществознание": ["обществ"]
      "история": ["истори"]
      "английский язык": ["английск", "иностранн"]
      "литература": ["литератур"]
      "география": ["географ"]

  - key: level
    type: scale
    required: false
    ask: "Как сейчас с этими предметами — примерно на каком уровне?"
    reask: "Скажите примерно: с нуля, слабо, средне или уверенно."
    options:
      "с нуля": ["с нуля", "с нуля", "ничего не зна", "не занимал", "с самого начала", "вообще ноль"]
      "слабый": ["слаб", "троеч", "тройки", "тройка", "еле тян", "не тян", "хромает", "двойки", "отста", "плохо", "запуст"]
      "средний": ["средн", "четвёрки", "четверки", "нормально", "неплохо", "не жалуемся"]
      "хороший": ["хорош", "пятёрки", "пятерки", "отличник", "уверенно"]
      "сильный": ["сильн", "олимпиад"]

  - key: goal
    type: scale
    required: false
    ask: "К какому результату идём — есть целевой балл или задача просто уверенно сдать?"
    reask: "Скажите ориентир: балл или «просто сдать»."
    options:
      "порог": ["просто сдать", "лишь бы сдать", "главное сдать", "порог", "аттестат", "не завал", "уверенно сдать"]
      "90+": ["максимальн", "стобалл", "сто баллов"]
    # Балл называют любым числом, синонимами это не покрыть.
    ranges:
      "порог": [1, 59]
      "60-69": [60, 69]
      "70-79": [70, 79]
      "80-89": [80, 89]
      "90+": [90, 100]

  - key: format
    type: scale
    required: false
    ask: "Что удобнее — занятия в группе или индивидуально? И очно или онлайн?"
    reask: "Напишите, что ближе: группа, мини-группа, индивидуально, очно или онлайн."
    options:
      "группа": ["групп"]
      "мини-группа": ["мини", "маленьк"]
      "индивидуально": ["индивидуальн", "один на один", "персональн", "репетитор"]
      "онлайн": ["онлайн", "дистанц", "удалённо", "удаленно"]
      "очно": ["очно", "очн", "вживую", "ходить"]

  - key: name
    type: text
    required: false
    ask: "Как к вам обращаться?"
    reask: "Напишите, пожалуйста, как к вам обращаться."

  - key: contact
    type: phone
    required: true
    phase: closing
    ask: "На какой номер администратору перезвонить, чтобы согласовать время диагностики? Формат любой."
    reask: "Похоже, в номере опечатка. Российский номер — 11 цифр, начинается с 7 или 8."

# Вычисляемые поля. Считаются из уже собранного, не спрашиваются.
# Год не вписан в код: месяцы считаются от системной даты, иначе значение
# начинает врать в новогоднюю ночь и ни один тест этого не замечает.
computed:
  - key: months_left
    from: grade
    method: months_until
    target_month: 6            # экзамены — начало июня
    offset_years:              # сколько лет до «своего» июня от ближайшего
      "8": 1
      "9": 0
      "10": 1
      "11": 0
    note: "срок до экзамена посчитан из класса, а не назван клиентом: осталось ~{value} мес."

# Этап предложения. Порог качественный: собрали класс и предметы — предлагаем,
# остальное уточняем по ходу. Полная анкета до предложения превращает разговор
# в опросник, а человек к этому моменту ещё не знает, ради чего отвечает.
proposal:
  max_followups: 3
  intro: "Смотрите, что здесь обычно подходит:"
  no_match: "Подобрать программу лучше на диагностике — там видно стартовый уровень."
  ready_words: ["записывайте", "записаться", "запишите", "давайте", "подходит", "согласен", "согласна", "хорошо"]
  # Первое подошедшее правило. Код не знает ни про классы, ни про курсы.
  rules:
    - when: [{field: months_left, less_than: 5}]
      offer: intensive
    - when: [{field: grade, in: [8, 9]}]
      offer: course_oge
    - when: [{field: grade, in: [10, 11]}]
      offer: course_ege

# Жёсткие правила по одному полю. Проверяются сразу после заполнения.
rules:
  - field: grade
    condition: "less_than"
    value: 8
    action: reject
    message: |
      Спасибо, что написали! Мы готовим к ОГЭ и ЕГЭ и берём ребят с 8 класса —
      раньше это просто рано, программа не про то. Будем рады видеть вас,
      когда дойдёте до восьмого.

# Правила по комбинации полей. Главное правило ниши: если срок и стартовый
# уровень не сходятся с заявленной целью, агент НЕ обещает результат.
# Это не отказ: диалог продолжается, решение остаётся за человеком,
# а менеджер получает расчёт, а не эмоцию.
combined_rules:
  - id: unrealistic_goal
    action: no_promise
    needs: [level, goal, months_left]
    level_field: level
    goal_field: goal
    time_field: months_left
    months_per_step: 4
    scales:
      level:
        "с нуля": 0
        "слабый": 1
        "средний": 2
        "хороший": 3
        "сильный": 4
      goal:
        "порог": 1
        "60-69": 2
        "70-79": 3
        "80-89": 4
        "90+": 5
    message: |
      Скажу честно, потому что иначе смысла нет. От уровня «{level}» до цели «{goal}»
      обычно нужно около {needed} месяцев регулярных занятий, а до экзамена осталось
      примерно {months_left}. Обещать такой результат я не буду — и никто не должен.
      Что предлагаю: прийти на бесплатную диагностику. Она покажет, какие темы просели
      и какая цель реалистична именно сейчас. Дальше решаете вы.
    flag: "цель под вопросом: старт «{level}», цель «{goal}», до экзамена {months_left} мес, ориентир {needed} мес — не обещать результат, обсудить на диагностике"

profile_confirm:
  labels:
    grade: "Класс"
    subjects: "Предметы"
    level: "Стартовый уровень"
    goal: "Цель"
    format: "Формат"
    name: "Имя"
    contact: "Телефон"
    months_left: "До экзамена, мес."
  summary_intro: "Собрала вот что — проверьте, пожалуйста:"
  ask: |
    Всё верно? Напишите «да» — и передам заявку администратору.
    Если что-то поправить — просто напишите как правильно.
  confirm_words: ["да", "верно", "всё", "все", "точно", "правильно", "ок", "окей", "ага", "угу"]
  reject_words: ["нет", "неверно", "не верно", "не так", "исправить", "поправить"]
  changed: "Поправила."
  what_to_fix: "Поняла, что-то не так. Напишите, что поправить — класс, предметы, уровень, цель, формат или телефон."
  incomplete: "Пока не хватает вот чего: {missing}."
  reask: |
    Не поняла. Если всё верно — напишите «да».
    Если нужно что-то поменять — напишите, как правильно.

# Целевое действие: запись на бесплатную диагностику.
registration:
  instruction: |
    Записываю на бесплатную диагностику. Как это проходит: 60 минут,
    пробный вариант по вашему предмету, разбор с преподавателем и письменный
    план — что просело и сколько времени нужно. Очно или онлайн, как удобнее.
    Администратор перезвонит по номеру {contact} и согласует время.
    Подтвердите, пожалуйста, что можно передавать заявку — напишите «да».
  confirm_words: ["да", "подтверждаю", "передавайте", "записывайте", "ок", "окей", "давайте", "хорошо", "жду", "согласен", "согласна"]
  reminder_after_hours: 3
  reminder_text: |
    Напоминаю про запись на диагностику в «Параболе» — без подтверждения
    не смогу передать заявку администратору. Передавать?
    Если появились вопросы, напишите — отвечу.

handoff:
  message: |
    Готово, заявка у администратора. Он перезвонит по номеру {contact}
    в рабочее время (пн–сб, 10:00–20:00), согласует время диагностики
    и ответит на организационные вопросы.
  manager_note: "клиент подтвердил запись на диагностику"

# База знаний. Раздел — адресация роли, а не оглавление каталога:
# про программы и сроки отвечает методист, про предметы под вуз — консультант
# по поступлению, про деньги и расписание — администратор.
knowledge:
  - section: programs
    role: "методист центра"
    role_brief: |
      Отвечает, какая программа подходит под стартовый уровень и цель, сколько
      нужно времени и что реально успеть. Говорит конкретно, цифрами занятий
      и месяцев. Никогда не обещает балл и не гарантирует поступление:
      вместо обещания предлагает диагностику. Если данных мало — так и говорит.
    entries:
      - id: course_ege
        keywords: ["курс егэ", "подготовка к егэ", "годовой курс", "программа егэ"]
        answer: |
          Годовой курс ЕГЭ: два занятия в неделю по 90 минут, с сентября по май,
          группа до 8 человек. Каждый месяц пробник в формате экзамена с разбором.
          6 900 ₽ в месяц за один предмет, второй предмет — со скидкой 10%.

      - id: course_oge
        keywords: ["курс огэ", "подготовка к огэ", "программа огэ", "девятый класс курс"]
        answer: |
          Годовой курс ОГЭ: два занятия в неделю по 90 минут, с сентября по май,
          группа до 8 человек. Раз в месяц пробник с разбором ошибок.
          5 900 ₽ в месяц за предмет.

      - id: intensive
        keywords: ["интенсив", "быстрый курс", "за три месяца", "короткий курс"]
        answer: |
          Интенсив: три занятия в неделю, три месяца. Это программа для тех, кто
          начал поздно: закрываем ключевые темы и формат экзамена, а не весь курс.
          9 900 ₽ в месяц. Честно: интенсив не заменяет год подготовки.

      - id: mini_group
        keywords: ["мини-группа", "маленькая группа", "четыре человека", "мало людей"]
        answer: |
          Мини-группа до 4 человек: та же программа, но преподаватель успевает
          дойти до каждого на каждом занятии. 11 900 ₽ в месяц за предмет.

      - id: individual
        keywords: ["индивидуальн", "один на один", "персонально", "с репетитором у вас"]
        answer: |
          Индивидуальные занятия: 60 минут, 2 400 ₽ за занятие. Берут обычно
          точечно — закрыть конкретные пробелы параллельно с курсом.

      - id: diagnostics
        keywords: ["диагностика", "пробное занятие", "бесплатное занятие", "тестирование"]
        answer: |
          Диагностика бесплатная и ни к чему не обязывает: 60 минут, пробный
          вариант по предмету, разбор с преподавателем и письменный план —
          какие темы просели и сколько времени нужно. Очно или онлайн.

      - id: pace
        keywords: ["сколько нужно времени", "сколько занятий", "успеем ли", "хватит ли времени", "за сколько подготовите"]
        answer: |
          Ориентир такой: на устойчивый переход с одного уровня на следующий
          обычно нужно около четырёх месяцев регулярных занятий — два занятия
          в неделю плюс домашняя работа. Это ориентир центра, а не обещание.
          Точнее скажет диагностика: она покажет, сколько тем просело.

      - id: no_guarantee
        keywords: ["гарантия", "гарантируете", "обещаете", "точно сдаст", "результат гарантирован", "а если не сдаст"]
        answer: |
          Балл не гарантирует никто, и мы не будем. Что делаем вместо этого:
          на диагностике смотрим стартовый уровень, показываем разрыв до цели
          в темах, а не в словах, и говорим, укладывается он в оставшееся время
          или нет. Если не укладывается — скажем сразу, а не в апреле.

      - id: late_start
        keywords: ["поздно", "уже поздно", "успеть за", "мало времени осталось", "начать сейчас"]
        answer: |
          Поздно не бывает, бывает другая цель. За три месяца можно закрыть
          ключевые темы и уверенно пройти порог. Разогнаться с нуля до девяноста
          за это время нельзя, и обещать этого мы не станем. Диагностика покажет,
          какая цель реалистична именно сейчас.

      - id: vs_tutor
        keywords: ["репетитор", "зачем центр", "лучше репетитора", "частный преподаватель"]
        answer: |
          У репетитора сильная сторона — он подстраивается под одного ученика.
          Наша — программа, рассчитанная на весь год до экзамена, ежемесячные
          пробники в формате экзамена и второй преподаватель, который видит
          работу свежим взглядом. Если нужны только точечные пробелы, честнее
          взять у нас индивидуальные занятия, а не курс.

      - id: motivation
        keywords: ["не хочет заниматься", "не мотивирован", "заставить", "ленится", "нет мотивации"]
        answer: |
          Это частая история, и давлением она не лечится. На диагностике
          преподаватель показывает подростку не «сколько всего не знаешь»,
          а ближайший достижимый шаг. Дальше работает формат группы: рядом
          сверстники с той же целью, и это держит лучше уговоров.

      - id: school_enough
        keywords: ["в школе готовят", "школьной подготовки", "зачем дополнительно", "и так учат"]
        answer: |
          В школе идёт программа класса, на экзамене — формат и типы заданий.
          Разрыв обычно не в знаниях, а в том, что ребёнок не видел достаточно
          вариантов и не считал время. Мы работаем именно с этим.

      - id: subjects_count
        keywords: ["сколько предметов", "два предмета", "три предмета", "потянет ли"]
        answer: |
          Больше двух предметов в интенсивном режиме тянут немногие. Обычно
          берут один-два курса, третий предмет — точечно индивидуально.
          На диагностике смотрим по каждому предмету отдельно.

  - section: admissions
    role: "консультант по выбору предметов"
    role_brief: |
      Помогает понять, какие предметы нужны под выбранное направление.
      Проходные баллы конкретных вузов не называет никогда: они меняются
      каждый год, и придуманная цифра — это враньё. Отправляет в правила
      приёма вуза. Про сам набор предметов говорит уверенно.
    entries:
      - id: passing_score
        keywords: ["проходной балл", "сколько баллов нужно", "проходной", "какой балл в вуз", "бюджет баллы"]
        answer: |
          Проходные баллы у каждого вуза свои и меняются каждый год — назову
          цифру, и она будет неправдой. Их публикуют в правилах приёма на сайте
          вуза за прошлый год. А вот набор предметов от вуза почти не зависит,
          и здесь помогу.

      - id: it_direction
        keywords: ["программист", "айти", "it направление", "разработчик", "информационные технологии"]
        answer: |
          На IT-направления чаще всего нужны профильная математика, русский
          и на выбор информатика или физика — зависит от вуза. Точный список
          смотрите в правилах приёма конкретного вуза, он публикуется заранее.

      - id: engineering_direction
        keywords: ["инженер", "технический вуз", "технические направления", "строитель"]
        answer: |
          На инженерные направления обычно нужны профильная математика, физика
          и русский. Точный перечень — в правилах приёма выбранного вуза.

      - id: medicine_direction
        keywords: ["медицин", "врач", "медицинский", "стоматолог"]
        answer: |
          На медицинские направления чаще всего требуются химия, биология
          и русский. Перечень и приоритеты предметов проверьте в правилах
          приёма вуза.

      - id: economics_direction
        keywords: ["экономик", "финанс", "менеджмент", "бизнес-направление"]
        answer: |
          На экономические направления обычно нужны профильная математика,
          русский и обществознание либо иностранный язык — набор отличается
          от вуза к вузу, смотрите правила приёма.

      - id: law_direction
        keywords: ["юрист", "юридическ", "право", "правоведение"]
        answer: |
          На юридические направления чаще всего нужны обществознание, история
          и русский. Точный список — в правилах приёма вуза.

      - id: humanities_direction
        keywords: ["лингвист", "переводчик", "филолог", "журналист", "иностранные языки"]
        answer: |
          На языковые и гуманитарные направления обычно нужны иностранный язык
          или литература, история и русский. Конкретный набор зависит
          от направления — проверьте в правилах приёма.

      - id: how_many_exams
        keywords: ["сколько экзаменов", "сколько сдавать", "какие егэ сдавать", "обязательные предметы"]
        answer: |
          Для поступления обычно сдают три предмета: русский, профильный
          и ещё один по направлению. Многие берут четвёртый как запасной,
          чтобы не сузить выбор вузов раньше времени.

      - id: add_subject_later
        keywords: ["добавить предмет", "передумали", "поменять предмет", "начать позже"]
        answer: |
          Добавить предмет можно в любой момент, но считайте время: чем позже
          старт, тем реалистичнее цель «уверенно сдать», а не «высокий балл».
          Перед решением лучше пройти диагностику по новому предмету.

  - section: organization
    role: "администратор центра"
    role_brief: |
      Отвечает про расписание, форматы, стоимость, документы и запись.
      Говорит конкретно и цифрами, ничего не смягчает и не обещает сверх
      написанного. Если условия нет в базе — предлагает уточнить у коллег.
    entries:
      - id: schedule
        keywords: ["расписание", "когда занятия", "во сколько", "какие дни", "время занятий"]
        answer: |
          Занятия по будням с 16:00 до 20:00 и по субботам с 10:00 до 16:00.
          Конкретные слоты подбирает администратор под ваше расписание.

      - id: online_offline
        keywords: ["онлайн", "дистанционно", "очно", "разница между онлайн", "удалённо"]
        answer: |
          Онлайн и очно — одна программа, одни преподаватели и одни пробники.
          Разница только в том, где вы сидите. Онлайн-занятия идут в прямом
          эфире, запись остаётся в личном кабинете.

      - id: payment
        keywords: ["сколько стоит", "цена", "стоимость", "оплата", "платить", "дорого"]
        answer: |
          Оплата помесячная, предоплаты за год нет. Групповой курс ЕГЭ —
          6 900 ₽ в месяц за предмет, ОГЭ — 5 900 ₽, мини-группа — 11 900 ₽,
          индивидуально — 2 400 ₽ за занятие. Второй предмет со скидкой 10%.
          Для сравнения: месяц индивидуальных занятий два раза в неделю
          выходит дороже группового курса примерно вдвое.

      - id: documents
        keywords: ["договор", "документы", "чек", "налоговый вычет", "справка"]
        answer: |
          Заключаем договор, оплату подтверждаем чеком. По запросу выдаём
          справку и договор для налогового вычета за обучение.

      - id: missed_lesson
        keywords: ["пропустил", "болел", "пропуск", "не сможем прийти", "запись занятия"]
        answer: |
          Пропущенное занятие остаётся в записи в личном кабинете, материалы
          и домашняя работа тоже. Если пропусков много, преподаватель
          предлагает разбор отдельно.

      - id: refund
        keywords: ["вернуть деньги", "возврат", "если бросим", "расторжение"]
        answer: |
          Если решите прекратить занятия, деньги за неиспользованные занятия
          возвращаются по заявлению. Договориться нужно до начала месяца.

      - id: group_size
        keywords: ["сколько человек в группе", "размер группы", "много ли детей"]
        answer: |
          В обычной группе до 8 человек, в мини-группе до 4. Больше восьми
          мы не набираем: на разбор ошибок каждого не хватит времени.

      - id: think_about_it
        keywords: ["подумаем", "посоветуюсь", "не готовы решать", "позже вернёмся"]
        answer: |
          Конечно. Диагностика бесплатная и ни к чему не обязывает — многие
          сначала приходят на неё, а решают уже после, когда видят письменный
          план. Записать вас, чтобы был запас по времени?

# Скоринг. Полей больше, чем у сервисного конфига, поэтому пороги свои.
scoring:
  hot:
    description: "профайл собран, запись на диагностику подтверждена"
    min_score: 5
  warm:
    description: "профайл собран, запись не подтверждена"
    min_score: 3
  cold:
    description: "данных мало или ответы уклончивые"
    min_score: 0

fallback:
  unknown_question: |
    Хороший вопрос — выдумывать ответ не буду. Передам его администратору,
    он ответит точно. Продолжим?
  escalate: |
    Такое лучше обсудить с человеком. Передаю диалог администратору {manager_contact},
    он свяжется с вами в рабочее время.
  escalate_triggers: ["жалоба", "суд", "обман", "вернуть деньги", "юрист", "полиция", "роспотребнадзор"]
